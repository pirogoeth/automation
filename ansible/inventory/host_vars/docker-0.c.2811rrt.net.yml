---
system_disk_mounts:
  - src: 10.100.0.6:/volume1/downloads
    dest: /mnt/downloads
    fstype: nfs
    options: defaults,noatime
    state: absent
  - src: 10.100.0.6:/volume1/plex-data
    dest: /mnt/plex-data
    fstype: nfs
    options: defaults,noatime
    state: absent

swarm_enabled: true
swarm_role: member
swarm_group: default
