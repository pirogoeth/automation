---
- name: Create automation directory
  ansible.builtin.file:
    path: /opt/automation
    state: directory
    owner: root
    group: root
    recurse: true

- name: Install packages
  ansible.builtin.apt:
    name: "{{ packages + (system_packages | default([])) | flatten }}"
    state: present
  vars:
    packages:
      - haveged
      - golang-go
      - python3-venv

- name: Create Ansible virtualenv
  ansible.builtin.pip:
    name: "{{ pip_packages + (ansible_pip_packages | default([])) | flatten }}"
    virtualenv: /opt/automation/venv
    virtualenv_site_packages: yes
    virtualenv_command: "{{ ansible_python_interpreter }} -m venv"
  vars:
    pip_packages:
      - docker
      - jsondiff

- name: Pivot into Ansible virtualenv
  set_fact:
    ansible_python_interpreter: "/opt/automation/venv/bin/python"

- ansible.builtin.include_tasks: serf.yml
  args:
    apply:
      vars:
        _serf_state: "{{ serf_state|default('absent') }}"
  tags: [serf, services]

- when:
    - raid_groups is not none
    - raid_groups | length > 0
  ansible.builtin.include_tasks: raid.yml
  tags: [raid, storage]
  loop: "{{ raid_groups }}"
  args:
    apply:
      vars:
        raid_name: "{{ item.name }}"
        raid_level: "{{ item.level|default(1) }}"
        raid_devices: "{{ item.devices }}"
        volume_group: "{{ item.volume_group }}"
        logical_volume: "{{ item.logical_volume }}"
        mount_point: "{{ item.mount_point }}"
        fs_type: "{{ item.fs_type|default('ext4') }}"
        run_anyway: "{{ item.yes_i_know_what_im_doing|default(false) }}"

- ansible.builtin.include_tasks: mailer.yml
  tags: [mailer, services]

- ansible.builtin.include_tasks: sshguard.yml
  tags: [sshguard, services]

- ansible.builtin.include_role:
    name: singleplatform-eng.users

- name: Manage system mounts
  ansible.posix.mount:
    path: "{{ item.dest }}"
    src: "{{ item.src }}"
    fstype: "{{ item.fstype }}"
    opts: "{{ item.options|default('') }}"
    boot: yes
    state: "{{ item.state|default(packer_image_type is defined|ternary('present', 'mounted')) }}"
  loop: "{{ system_disk_mounts|default([]) }}"
